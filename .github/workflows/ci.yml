name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run test:e2e

  publish:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - run: npm run build
      # The release tag is the record of what shipped, not package.json on
      # master. This job cannot commit a bump back to the branch: master is
      # protected (pull requests only), and the bypass list cannot name the
      # actor GITHUB_TOKEN runs as -- rulesets only accept apps installed on
      # the repository, and the built-in GitHub Actions integration is not one.
      #
      # The bump still happens here rather than in a local git hook so that
      # merges authored by bots get a fresh version too: Dependabot never runs
      # husky, so it used to reach master on an already-published version and
      # fail with 409.
      #
      # package.json acts as a floor rather than the source: whichever of the
      # two is higher becomes the base for the patch bump. So hand-editing it
      # to 1.1.0 makes the next release 1.1.1, which is how the previous
      # `npm version patch` flow behaved too.
      - name: Resolve next version
        id: bump
        run: |
          TAGGED="$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          PACKAGED="$(node -p "require('./package.json').version")"
          BASE="$(printf '%s\n%s\n' "${TAGGED:-0.0.0}" "$PACKAGED" | sort -V | tail -n1)"
          npm version "$BASE" --no-git-tag-version --allow-same-version >/dev/null
          VERSION="$(npm version patch --no-git-tag-version | sed 's/^v//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Tagged before publishing so a publish failure leaves git ahead of the
      # registry, not behind: the next merge bumps past the unused tag. The
      # reverse order would leave the registry holding a version no tag records,
      # and the next run would retry it and 409. A tag push does not match this
      # workflow's branch filter, so this cannot loop.
      - name: Push release tag
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"
      - run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.bump.outputs.version }}"
          gh release create "$VERSION" --title "$VERSION" --generate-notes
