name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run test:e2e

  publish:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - run: npm run build
      # The version bump lives here rather than in a local git hook so that
      # merges authored by bots (Dependabot) get a fresh version too -- bots
      # never run husky, so they used to reach master on an already-published
      # version and fail with 409. Committing by hand with hooks disabled:
      # `npm ci` installs husky, and .husky/pre-commit shells out to gitleaks,
      # which is not on the runner.
      - name: Bump version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -am "chore: bump version to $VERSION"
          git tag "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # Pushed before publishing so a publish failure leaves git ahead of the
      # registry, not behind: the next merge just bumps past it. Pushes made
      # with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Push version bump
        run: git push --follow-tags origin HEAD:${{ github.ref_name }}
      - run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.bump.outputs.version }}"
          gh release create "$VERSION" --title "$VERSION" --generate-notes
